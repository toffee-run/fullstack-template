identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/kratos/config/identity.schema.json

serve:
  admin:
    host: 0.0.0.0

selfservice:
  methods:
    password:
      enabled: true
    code:
      enabled: true
      config:
        passwordless_enabled: false

  flows:
    registration:
      style: unified
      after:
        password:
          hooks:
            - hook: session
            - hook: show_verification_ui

    verification:
      enabled: true
      use: code

    recovery:
      enabled: true
      use: code

courier:
  smtp:
    from_address: no_reply@abc.com
    from_name: Auth Service

tracing:
  provider: otel
  providers:
    otlp:
      insecure: true
